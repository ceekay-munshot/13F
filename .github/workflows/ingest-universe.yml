name: Ingest full universe (DERA → R2)

# ---------------------------------------------------------------------------
# The full-universe pipeline: every 13F filer for the recent quarters, from the
# SEC's quarterly data set, uploaded to R2.
#
# Runs monthly, because the SEC publishes the structured data set on a lag —
# roughly a month after each filing deadline — so there is nothing new to pull
# more often. The watchlist day-of freshness during filing season is the
# separate ingest.yml path.
#
# It does NOT commit anything: at ~900 MB the artifact tree belongs in R2, not
# git history. The Pages Function serves it from R2 on the same origin.
# ---------------------------------------------------------------------------
on:
  schedule:
    - cron: '23 6 3 * *'   # 3rd of each month, after the data set publishes
  workflow_dispatch:
    inputs:
      windows:
        description: 'How many quarterly windows to merge'
        default: '4'
      top:
        description: 'Store line items for the largest N funds (plus the watchlist)'
        default: '99999'
      keep:
        description: 'Quarters of holdings to retain'
        default: '4'

concurrency:
  group: 13f-universe
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate configuration
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          for v in SEC_USER_AGENT R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set"; missing=1; fi
          done
          case "$SEC_USER_AGENT" in *@*.*) ;; *) echo "::error::SEC_USER_AGENT needs a contact email"; missing=1 ;; esac
          [ "$missing" = "0" ] || { echo "::error::See DEPLOY.md for the required GitHub secrets and variable."; exit 1; }

      - run: npm ci

      - name: Correctness gates
        run: npm run check

      - name: Refresh CUSIP to ticker map
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          SEC_RATE_LIMIT_RPS: '5'
        run: node scripts/build-securities.mjs --months=6

      - name: Ingest universe
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          SEC_RATE_LIMIT_RPS: '5'
        run: |
          node --max-old-space-size=13312 scripts/ingest-dera.mjs \
            --out=public/data \
            --windows=${{ github.event.inputs.windows || '4' }} \
            --top=${{ github.event.inputs.top || '99999' }} \
            --keep=${{ github.event.inputs.keep || '4' }}

      - name: Publish to R2 (with prune)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || '13f' }}
        # --prune deletes fund-quarters that rolled out of the retention window,
        # so R2 never grows past ~4 quarters of the universe.
        run: node scripts/publish-r2.mjs --dir=public/data --prune

      - name: Summary
        if: always()
        run: |
          echo '### Universe ingest' >> "$GITHUB_STEP_SUMMARY"
          echo "objects: $(find public/data -type f | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "size: $(du -sh public/data | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = '13f-universe-failure';
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: label });
            if (open.data.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title: 'Full-universe ingest is failing', body, labels: [label] });
            }
