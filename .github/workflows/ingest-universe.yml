name: Ingest full universe (DERA → R2)

# ---------------------------------------------------------------------------
# The full-universe pipeline: every 13F filer for the recent quarters, from the
# SEC's quarterly data set, uploaded to R2.
#
# Runs monthly, because the SEC publishes the structured data set on a lag —
# roughly a month after each filing deadline — so there is nothing new to pull
# more often. The watchlist day-of freshness during filing season is the
# separate ingest.yml path.
#
# It does NOT commit anything: at ~900 MB the artifact tree belongs in R2, not
# git history. The Pages Function serves it from R2 on the same origin.
# ---------------------------------------------------------------------------
on:
  schedule:
    - cron: '23 6 3 * *'   # 3rd of each month, after the data set publishes
  workflow_dispatch:
    inputs:
      windows:
        description: 'How many quarterly windows to merge'
        default: '4'
      top:
        description: 'Store line items for the largest N funds (plus the watchlist)'
        default: '99999'
      keep:
        description: 'Quarters of holdings to retain'
        default: '4'

concurrency:
  group: 13f-universe
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate configuration
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          for v in SEC_USER_AGENT R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set"; missing=1; fi
          done
          case "$SEC_USER_AGENT" in *@*.*) ;; *) echo "::error::SEC_USER_AGENT needs a contact email"; missing=1 ;; esac
          [ "$missing" = "0" ] || { echo "::error::See DEPLOY.md for the required GitHub secrets and variable."; exit 1; }

      - run: npm ci

      - name: Correctness gates
        run: npm run check

      # ENRICHMENT, NOT DATA — and therefore continue-on-error.
      #
      # This step resolves CUSIPs to tickers. If it fails, holdings render with
      # the issuer name the filer typed instead of a ticker: a cosmetic
      # degradation that changes no value, share count, or delta. It previously
      # ran without this guard and a transient SEC 503 killed the whole job
      # BEFORE the ingest and the R2 publish had run — throwing away the entire
      # universe refresh over a display column.
      #
      # The outcome is surfaced in the summary rather than swallowed, so a
      # persistently failing map is visible without being fatal.
      - name: Refresh CUSIP to ticker map
        id: securities
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          SEC_RATE_LIMIT_RPS: '5'
        run: node scripts/build-securities.mjs --months=6

      # Same contract as the ticker map: enrichment, never a blocker. Without it
      # every sector reads "Unclassified", which is legible; a failed run here
      # must not cost the universe ingest that follows.
      - name: Refresh sector map
        id: sectors
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          SEC_RATE_LIMIT_RPS: '5'
        run: node scripts/build-sectors.mjs --quarters=4

      - name: Note degraded enrichment
        if: steps.securities.outcome != 'success'
        run: |
          echo "::warning::CUSIP->ticker refresh failed — holdings will show issuer names without tickers. Values and deltas are unaffected."

      - name: Ingest universe
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          SEC_RATE_LIMIT_RPS: '5'
        run: |
          node --max-old-space-size=13312 scripts/ingest-dera.mjs \
            --out=public/data \
            --windows=${{ github.event.inputs.windows || '4' }} \
            --top=${{ github.event.inputs.top || '99999' }} \
            --keep=${{ github.event.inputs.keep || '4' }}

      - name: Publish to R2 (with prune)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || '13f' }}
        # --prune deletes fund-quarters that rolled out of the retention window,
        # so R2 never grows past ~4 quarters of the universe.
        run: node scripts/publish-r2.mjs --dir=public/data --prune

      # A green publish step is not proof of a working site. R2 accepted 35,628
      # objects and the dashboard was still dead, because the one file it loads
      # first had not landed. Assert the live origin actually serves a usable
      # manifest, and fail loudly if it does not — silent staleness is the worst
      # failure mode this project has.
      - name: Smoke check the live origin
        env:
          SITE: ${{ vars.SITE_URL || 'https://13f-eo2.pages.dev' }}
        run: |
          url="$SITE/data/manifest.json?smoke=$GITHUB_RUN_ID"
          code=$(curl -sS -o /tmp/manifest.json -w '%{http_code}' --max-time 30 "$url" || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::$url returned $code — the dashboard cannot load."
            exit 1
          fi
          # NOTE on what is asserted: `manifest.funds` is an OVERRIDE map — it
          # only lists filers whose build id differs from the root one — so an
          # empty object is normal and says nothing about coverage. The real
          # health signals are counts.filers and the periods array.
          node -e '
            const m = JSON.parse(require("fs").readFileSync("/tmp/manifest.json", "utf8"));
            const filers = m.counts?.filers ?? 0;
            const periods = m.periods?.length ?? 0;
            if (!m.buildId || filers < 1000 || periods < 1) {
              console.log("::error::live manifest is unusable — buildId=" + m.buildId +
                          " filers=" + filers + " periods=" + periods);
              process.exit(1);
            }
            console.log("live manifest ok — buildId " + m.buildId + ", " + filers +
                        " filers, " + periods + " periods, generated " + m.generatedAt);
          '
          # And confirm a real artifact resolves, not just the index.
          probe="$SITE/data/fund/0001067983/summary.json"
          pcode=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$probe" || echo 000)
          [ "$pcode" = "200" ] || { echo "::error::$probe returned $pcode"; exit 1; }
          echo "artifact probe ok"

      - name: Summary
        if: always()
        run: |
          echo '### Universe ingest' >> "$GITHUB_STEP_SUMMARY"
          if [ -d public/data ]; then
            echo "objects: $(find public/data -type f | wc -l)" >> "$GITHUB_STEP_SUMMARY"
            echo "size: $(du -sh public/data | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "objects: none — ingest did not produce a tree" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.securities.outcome }}" = "success" ]; then
            echo "ticker map: refreshed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ticker map: **not refreshed** (holdings show issuer names; values unaffected)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = '13f-universe-failure';
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: label });
            if (open.data.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title: 'Full-universe ingest is failing', body, labels: [label] });
            }
