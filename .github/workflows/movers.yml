name: Build the Sectors tab

# ---------------------------------------------------------------------------
# Rebuilds movers/{quarter}.json — every focused manager's trades for the
# quarter — which is all the Sectors tab reads.
#
# Runs after anything that changes the site's data, so the tab is never more
# than one run behind the fund pages. It only reads funds whose data changed
# since its last build (see scripts/build-movers.mjs), so most runs take about
# a minute.
#
# Once a week it also rebuilds the ticker -> sector list (movers/sectors.json),
# which both the Sectors tab and Consensus's Sector flows read. The monthly one
# left a quarter of all money traded "Unclassified"; see shared/sectors.mjs.
#
# It writes only under movers/, which nothing else writes, and never the
# manifest. If it cannot read enough of the site to trust its answer it
# publishes nothing and the tab keeps its last good copy.
# ---------------------------------------------------------------------------
on:
  workflow_run:
    workflows:
      - "Ingest 13F filings"
      - "Ingest full universe (DERA → R2)"
      - "Repair the shared indexes"
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build everything but publish nothing (to try a change from a branch)'
        type: boolean
        default: false

concurrency:
  group: 13f-movers
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  build:
    # A cancelled update published nothing, so there is nothing new to read.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate configuration
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set — see DEPLOY.md."; exit 1; fi
          done

      - run: npm ci

      - name: Correctness gates
        run: npm run check

      # Weekly, and a few seconds otherwise: it reads when the list was last
      # built and stops there if that was under 7 days ago. The first build asks
      # the SEC about ~2,000 companies one by one (about 12 minutes at 3 a
      # second); after that only companies new since the last build are asked.
      - name: Refresh the sector list (weekly)
        id: sectors
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          SEC_RATE_LIMIT_RPS: '3'
          SITE: ${{ vars.SITE_URL || 'https://13f-eo2.pages.dev' }}
          # A dry run is given no storage keys at all, so it CANNOT publish —
          # not merely told not to. (An empty string counts as false in these
          # expressions, which is how the first version of this switch would
          # have published anyway; the order below is the safe one.)
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
          R2_ACCOUNT_ID: ${{ github.event.inputs.dry_run != 'true' && secrets.R2_ACCOUNT_ID || '' }}
          R2_ACCESS_KEY_ID: ${{ github.event.inputs.dry_run != 'true' && secrets.R2_ACCESS_KEY_ID || '' }}
          R2_SECRET_ACCESS_KEY: ${{ github.event.inputs.dry_run != 'true' && secrets.R2_SECRET_ACCESS_KEY || '' }}
          R2_BUCKET: ${{ vars.R2_BUCKET || '13f' }}
          PUBLISH: ${{ github.event.inputs.dry_run != 'true' && '--publish' || '' }}
        run: |
          node scripts/build-sectors.mjs --quarters=4 \
            --previous="$SITE/data/movers/sectors.state.json" --fresh-days=7 \
            --out=.build/sectors.json $PUBLISH

      # Runs even if the sector list could not be refreshed: the last list is
      # still good, and the job still ends red so the failure is seen.
      - name: Build and publish
        if: ${{ !cancelled() }}
        env:
          SITE: ${{ vars.SITE_URL || 'https://13f-eo2.pages.dev' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
          R2_ACCOUNT_ID: ${{ github.event.inputs.dry_run != 'true' && secrets.R2_ACCOUNT_ID || '' }}
          R2_ACCESS_KEY_ID: ${{ github.event.inputs.dry_run != 'true' && secrets.R2_ACCESS_KEY_ID || '' }}
          R2_SECRET_ACCESS_KEY: ${{ github.event.inputs.dry_run != 'true' && secrets.R2_SECRET_ACCESS_KEY || '' }}
          R2_BUCKET: ${{ vars.R2_BUCKET || '13f' }}
          PUBLISH: ${{ github.event.inputs.dry_run != 'true' && '--publish' || '' }}
        # .build/sectors.json exists only when the step above rebuilt the list.
        run: node scripts/build-movers.mjs --origin="$SITE" --out=.build/movers --sectors=.build/sectors.json $PUBLISH

      # A dry run keeps what it built, so a change can be checked before it
      # goes live. Nothing here is read by the dashboard.
      - name: Keep the dry run's output
        if: ${{ !cancelled() && github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run
          path: |
            .build/sectors.json
            .build/movers/movers/*.json
          retention-days: 3

      # One issue, opened once. This runs every half hour in filing season, and
      # an alert that repeats every half hour is one people learn to ignore.
      - name: Open a failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = '13f-movers-failure';
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: label });
            if (open.data.length) return;
            const body = [
              'The Sectors tab could not be rebuilt. It still shows its last good copy, which will fall behind the fund pages until this is fixed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.create({ ...context.repo, title: 'The Sectors tab is not updating', body, labels: [label] });
