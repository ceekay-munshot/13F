name: Build the Sectors tab

# ---------------------------------------------------------------------------
# Rebuilds movers/{quarter}.json — every focused manager's trades for the
# quarter — which is all the Sectors tab reads.
#
# Runs after anything that changes the site's data, so the tab is never more
# than one run behind the fund pages. It only reads funds whose data changed
# since its last build (see scripts/build-movers.mjs), so most runs take about
# a minute.
#
# It writes only under movers/, which nothing else writes, and never the
# manifest. If it cannot read enough of the site to trust its answer it
# publishes nothing and the tab keeps its last good copy.
# ---------------------------------------------------------------------------
on:
  workflow_run:
    workflows:
      - "Ingest 13F filings"
      - "Ingest full universe (DERA → R2)"
      - "Repair the shared indexes"
    types: [completed]
  workflow_dispatch:

concurrency:
  group: 13f-movers
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  build:
    # A cancelled update published nothing, so there is nothing new to read.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate configuration
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set — see DEPLOY.md."; exit 1; fi
          done

      - run: npm ci

      - name: Correctness gates
        run: npm run check

      - name: Build and publish
        env:
          SITE: ${{ vars.SITE_URL || 'https://13f-eo2.pages.dev' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || '13f' }}
        run: node scripts/build-movers.mjs --origin="$SITE" --out=.build/movers --publish

      # One issue, opened once. This runs every half hour in filing season, and
      # an alert that repeats every half hour is one people learn to ignore.
      - name: Open a failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = '13f-movers-failure';
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: label });
            if (open.data.length) return;
            const body = [
              'The Sectors tab could not be rebuilt. It still shows its last good copy, which will fall behind the fund pages until this is fixed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.create({ ...context.repo, title: 'The Sectors tab is not updating', body, labels: [label] });
