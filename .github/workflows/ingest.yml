name: Ingest 13F filings

# ---------------------------------------------------------------------------
# THREE off-minute slots, all after the EDGAR cutoff.
#
# Filings submitted after 17:30 ET are assigned the NEXT business day's filing
# date, so a job that runs at UTC midnight systematically truncates the day it
# thinks it is covering. These slots are 19:07, 21:13 and 23:31 ET.
#
# Three, not one, because GitHub is explicit that scheduled runs are best-effort:
# "The schedule event can be delayed during periods of high loads... some queued
# jobs may be dropped." A single slot has silently lost multi-day windows in a
# sibling repo. The job is idempotent, so extra runs are free.
#
# Never :00 or :30 — those minutes are the most contended on the whole platform.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# SAME-DAY 13F INGEST. Runs on a schedule again, and now publishes to R2.
#
# It was switched off on 2026-07-31 after taking the live dashboard from 9,396
# funds down to 8: it wrote manifest.json and meta/filers.json — the shared
# indexes describing the whole universe — with this job's twelve-fund versions.
#
# Three things changed so it can run safely:
#
#   1. IT NO LONGER WRITES SHARED INDEXES. scripts/publish-day.mjs uploads
#      fund/{cik}/** and nothing else, enforced by an allowlist
#      (shared/manifest-merge.mjs) rather than by remembering.
#   2. IT MERGES THE MANIFEST INSTEAD OF REPLACING IT. The live copy is the
#      base, the run may only add, and the result is verified against the live
#      copy before it is allowed to leave. Nothing shrinks.
#   3. IT FOLLOWS THE FILINGS, NOT A LIST. Discovery reads EDGAR's daily index
#      — one request covering every filer — so any manager who publishes gets
#      picked up, not just a hard-coded dozen.
#
# It also no longer COMMITS anything. It now discovers hundreds of funds on a
# deadline day, and the artifact tree belongs in R2 for exactly the reason
# scripts/publish-r2.mjs exists: git keeps every version forever.
#
# Every three hours, because 13F filings arrive throughout the day and "same
# day" is the whole point. Off-minute deliberately — :00 is the most contended
# minute on the platform.
# ---------------------------------------------------------------------------
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      periods:
        # TWO, not eight. A delta needs the filed quarter and the one before it,
        # and this now runs over every fund that filed — hundreds on a deadline
        # day. Eight was the default when this job ingested a dozen; leaving it
        # there meant a hand-dispatched run did four times the work of the
        # scheduled one and ran into the timeout. Longer history is preserved by
        # merging each fund's summary, not by re-fetching it.
        description: 'Quarters of history to ingest (2 is enough for deltas)'
        default: '2'
      funds:
        description: 'Comma-separated CIKs (blank = whoever filed, from EDGAR daily index)'
        default: ''
      force:
        description: 'Rebuild artifacts even if nothing changed'
        type: boolean
        default: false

# Queue, never cancel: each run does real work and a cancelled run leaves the
# artifact tree half-written.
concurrency:
  group: 13f-ingest
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Generous but bounded. A full seed ingest is ~4 minutes; anything past 30
    # means something is hung, and failing fast beats burning six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Fail before doing any work, with a message that says what to fix.
      - name: Validate configuration
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Repository variable SEC_USER_AGENT is not set."
            echo "::error::The SEC rejects undeclared automated access. Set it to"
            echo "::error::'<App or Company Name> <contact email>', e.g. 'Munshot 13F Pipeline you@example.com'."
            exit 1
          fi
          case "$SEC_USER_AGENT" in
            *@*.*) ;;
            *) echo "::error::SEC_USER_AGENT must contain a contact email address."; exit 1 ;;
          esac

      - run: npm ci

      # The correctness gates run BEFORE any network call. If the parser is
      # broken we would rather publish nothing than publish wrong numbers.
      - name: Correctness gates
        run: npm run check

      # continue-on-error: this is a display column, not data. A transient SEC
      # 503 here must never cost the filings ingest that follows it.
      - name: Refresh CUSIP to ticker map
        id: securities
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          SEC_RATE_LIMIT_RPS: '5'
        # The map only grows, and the fails-to-deliver files publish on a lag, so
        # a short window each day is enough to stay current without re-reading a
        # year of archives every run.
        run: node scripts/build-securities.mjs --months=4

      - name: Note degraded enrichment
        if: steps.securities.outcome != 'success'
        run: |
          echo "::warning::CUSIP->ticker refresh failed — holdings will show issuer names without tickers. Values and deltas are unaffected."

      # WHO FILED? Follow the filings, not a list.
      #
      # EDGAR's daily index is one file per day covering every filer, so this is
      # a couple of requests rather than a crawl. A manual dispatch that names
      # funds explicitly skips discovery and uses exactly those.
      - name: Discover today's 13F filers
        id: discover
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          SEC_RATE_LIMIT_RPS: '5'
        run: |
          if [ -n "${{ github.event.inputs.funds }}" ]; then
            echo "ciks=${{ github.event.inputs.funds }}" >> "$GITHUB_OUTPUT"
            echo "Using the funds given on dispatch."
            exit 0
          fi
          # DISCOVERY IS BEST-EFFORT; THE WATCHLIST IS THE FLOOR.
          #
          # A 403 from the SEC is an IP-level block and is not retryable, so the
          # discovery step is allowed to fail — but "we could not ask who filed"
          # must not become "publish nothing today". Fall back to the curated
          # watchlist, which needs no discovery because the CIKs are known, and
          # shout about the degradation so it is not mistaken for a quiet day.
          if CIKS="$(node scripts/discover-13f-filers.mjs --days=2)"; then
            echo "ciks=$CIKS" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Discovery failed (likely an SEC IP block). Falling back to the watchlist — funds outside it will NOT get same-day data this run."
            echo "ciks=$(node -e "import('./src/lib/favourites.ts').catch(()=>{});" 2>/dev/null || true)" > /dev/null
            CIKS="$(node -e "
              const s=require('fs').readFileSync('src/lib/favourites.ts','utf8');
              const m=[...s.matchAll(/cik:\s*\"(\d{10})\"/g)].map(x=>x[1]);
              process.stdout.write([...new Set(m)].join(','));
            ")"
            echo "ciks=$CIKS" >> "$GITHUB_OUTPUT"
            echo "degraded=true" >> "$GITHUB_OUTPUT"
          fi

      # Nothing filed is a legitimate outcome on a quiet day — stop cleanly
      # rather than running an ingest over an empty list and publishing a
      # manifest for no reason.
      - name: Nothing new
        if: steps.discover.outputs.ciks == ''
        run: |
          echo "No 13F filings in the window. Nothing to publish."
          echo 'No 13F filings in the window.' >> "$GITHUB_STEP_SUMMARY"

      - name: Ingest filings and build artifacts
        if: steps.discover.outputs.ciks != ''
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          SEC_RATE_LIMIT_RPS: '5'
        # Two quarters, not eight: a delta needs the filed quarter and the one
        # before it, and this runs every three hours over hundreds of funds.
        # The fund's longer history is preserved by merging its summary rather
        # than by re-fetching it — see shared/manifest-merge.mjs.
        run: |
          node scripts/ingest-funds.mjs \
            --periods=${{ github.event.inputs.periods || '2' }} \
            --funds='${{ steps.discover.outputs.ciks }}' \
            --out=public/data | tee /tmp/ingest.log

      - name: Summary
        if: always()
        run: |
          echo '### 13F ingest' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -25 /tmp/ingest.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo '(no log)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # PUBLISH TO R2 — ADDITIVELY.
      #
      # This is the step that was removed on 2026-07-31 after it took the site
      # from 9,396 funds to 8. It is back in a form that cannot repeat that:
      # publish-day.mjs uploads only fund/{cik}/** for the CIKs this run
      # actually ingested, MERGES manifest.json into the live copy rather than
      # replacing it, and verifies the merge against the live copy before
      # writing. If the live manifest cannot be read, or the merge would lose a
      # period or a filer, it exits non-zero having written NOTHING.
      #
      # NOT COMMITTED TO GIT. This job now discovers hundreds of funds on a
      # deadline day, and git keeps every version forever — the exact problem
      # R2 exists to solve. The committed tree stays as the universe job left
      # it, which is what the manifest fallback in functions/data/[[path]].js
      # is supposed to serve.
      # ---------------------------------------------------------------------
      - name: Publish to R2
        if: steps.discover.outputs.ciks != ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || '13f' }}
        run: |
          node scripts/publish-day.mjs \
            --dir=public/data \
            --ciks='${{ steps.discover.outputs.ciks }}' | tee -a /tmp/ingest.log

      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = '13f-ingest-failure';
            const title = '13F ingest is failing';
            const body = [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'If the log shows a SEC 403: that is an IP-level block on a shared GitHub runner and is',
              'NOT retryable. The next scheduled slot draws a different IP and normally recovers.',
              'Escalate only if several CONSECUTIVE runs are blocked — that means the block is',
              'following our behaviour rather than our luck.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label,
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: [label] });
            }
