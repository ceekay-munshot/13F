name: Ingest 13F filings

# ---------------------------------------------------------------------------
# THREE off-minute slots, all after the EDGAR cutoff.
#
# Filings submitted after 17:30 ET are assigned the NEXT business day's filing
# date, so a job that runs at UTC midnight systematically truncates the day it
# thinks it is covering. These slots are 19:07, 21:13 and 23:31 ET.
#
# Three, not one, because GitHub is explicit that scheduled runs are best-effort:
# "The schedule event can be delayed during periods of high loads... some queued
# jobs may be dropped." A single slot has silently lost multi-day windows in a
# sibling repo. The job is idempotent, so extra runs are free.
#
# Never :00 or :30 — those minutes are the most contended on the whole platform.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# THE SCHEDULE IS OFF. Manual dispatch only, until this job can publish safely.
#
# It ingests the SEED WATCHLIST (a dozen managers). ingest-universe.yml ingests
# all 9,396 filers, and R2 — which is what the site actually reads — is built
# from that. But both jobs write the SAME shared indexes: manifest.json and
# meta/filers.json. So every scheduled run of this job committed a manifest
# describing twelve funds over one describing the universe.
#
# That was survivable while the committed tree was dead weight. It is not
# anymore: functions/data/[[path]].js now falls back to the deployed
# manifest.json when R2 has none, so the committed copy is the safety net for a
# total outage, and a twelve-fund safety net is barely a net at all.
#
# What this job is FOR is real — day-of freshness for tracked managers during
# filing season, ahead of the ~3-week DERA lag. Restoring it needs one change:
# write and publish only its own fund/* keys, never the shared indexes. Until
# then a scheduled run costs churn and risks the fallback, so it does not run
# on its own. Dispatch it by hand when you want a watchlist refresh.
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      periods:
        description: 'Quarters of history to ingest'
        default: '8'
      funds:
        description: 'Comma-separated CIKs (blank = the seed watchlist)'
        default: ''
      force:
        description: 'Rebuild artifacts even if nothing changed'
        type: boolean
        default: false

# Queue, never cancel: each run does real work and a cancelled run leaves the
# artifact tree half-written.
concurrency:
  group: 13f-ingest
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Generous but bounded. A full seed ingest is ~4 minutes; anything past 30
    # means something is hung, and failing fast beats burning six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Fail before doing any work, with a message that says what to fix.
      - name: Validate configuration
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Repository variable SEC_USER_AGENT is not set."
            echo "::error::The SEC rejects undeclared automated access. Set it to"
            echo "::error::'<App or Company Name> <contact email>', e.g. 'Munshot 13F Pipeline you@example.com'."
            exit 1
          fi
          case "$SEC_USER_AGENT" in
            *@*.*) ;;
            *) echo "::error::SEC_USER_AGENT must contain a contact email address."; exit 1 ;;
          esac

      - run: npm ci

      # The correctness gates run BEFORE any network call. If the parser is
      # broken we would rather publish nothing than publish wrong numbers.
      - name: Correctness gates
        run: npm run check

      # continue-on-error: this is a display column, not data. A transient SEC
      # 503 here must never cost the filings ingest that follows it.
      - name: Refresh CUSIP to ticker map
        id: securities
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          SEC_RATE_LIMIT_RPS: '5'
        # The map only grows, and the fails-to-deliver files publish on a lag, so
        # a short window each day is enough to stay current without re-reading a
        # year of archives every run.
        run: node scripts/build-securities.mjs --months=4

      - name: Note degraded enrichment
        if: steps.securities.outcome != 'success'
        run: |
          echo "::warning::CUSIP->ticker refresh failed — holdings will show issuer names without tickers. Values and deltas are unaffected."

      - name: Ingest filings and build artifacts
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          SEC_RATE_LIMIT_RPS: '5'
        run: |
          node scripts/ingest-funds.mjs \
            --periods=${{ github.event.inputs.periods || '8' }} \
            ${{ github.event.inputs.funds && format('--funds={0}', github.event.inputs.funds) || '' }} \
            --out=public/data | tee /tmp/ingest.log

      - name: Summary
        if: always()
        run: |
          echo '### 13F ingest' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -25 /tmp/ingest.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo '(no log)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Publish.
      #
      # The artifact tree IS the database, so committing it is the deploy:
      # Cloudflare Pages rebuilds on push and serves the files straight off the
      # edge. No server, no upload credentials, and the data is versioned and
      # auditable in git for free.
      #
      # This works because the seed tree is ~6 MB. It does NOT scale to the full
      # universe — see the R2 step below, which takes over once the tree is large
      # enough that git history would become the problem.
      # ---------------------------------------------------------------------
      - name: Commit artifacts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # NOT data/securities.json — it is a CUSIP-keyed map and this repo is
          # public. It is rebuilt from the SEC each run, so there is nothing to
          # persist. See .gitignore.
          git add public/data public/_headers
          if git diff --cached --quiet; then
            echo "No artifact change; nothing to commit."
            exit 0
          fi
          # Deliberately NO [skip ci]: Cloudflare Pages reads it as a build-skip
          # directive, and this is precisely the build that publishes the data.
          git commit -m "data: refresh 13F artifacts ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # ---------------------------------------------------------------------
      # THERE IS NO R2 PUBLISH HERE, AND THAT IS DELIBERATE.
      #
      # A step used to live here, and on 2026-07-31 it took the live dashboard
      # from 9,396 funds down to 8. What it did wrong, in order of what actually
      # bit:
      #
      #   1. It overwrote manifest.json and meta/filers.json — the shared
      #      indexes describing the whole 9,396-filer universe — with this job's
      #      SEED-WATCHLIST versions. Both jobs write the same two keys, and
      #      this one only ever knows about a dozen managers. OBSERVED, twice,
      #      in runs 30592851223 and 30604563470.
      #   2. `--content-encoding gzip` on artifacts that have been PLAIN JSON
      #      since 37b23b3. R2 persists contentEncoding as object metadata and
      #      functions/data/[[path]].js replays it via writeHttpMetadata, so
      #      every artifact would arrive claiming a gzip wrapper it does not
      #      have — the exact mistake that broke every widget on this site once
      #      before. It did NOT surface this time (responses carried no
      #      content-encoding), but nothing in the pipeline was preventing it;
      #      `npm run guard` now does.
      #   3. Wrote to `muns-13f` by default, which is not the bucket (`13f`).
      #   4. Cached every object `immutable` for a year with no build-id key.
      #
      # For the record, because the wrong version of this note was committed in
      # b045114: the step's `if: ${{ env.R2_ACCOUNT_ID != '' }}` guard DID
      # evaluate true and the step DID run. A step's own `env:` block IS in
      # scope for its own `if:`. It was never dormant, and treating it as
      # harmless-because-dead was wrong.
      #
      # R2 has ONE writer: scripts/publish-r2.mjs, driven by
      # ingest-universe.yml. It is signature-tested, resumable, refuses to run
      # without a manifest, and publishes the manifest before it prunes. Adding
      # a second writer that produces a narrower universe is not a freshness
      # win, it is a race to clobber. Re-enabling in-season freshness means
      # teaching this job to publish only its own fund/* keys and never the
      # shared indexes — see the note on the schedule above.
      # ---------------------------------------------------------------------

      # One rolling issue per failure mode, so a transient blip does not bury the
      # alert that matters.
      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = '13f-ingest-failure';
            const title = '13F ingest is failing';
            const body = [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'If the log shows a SEC 403: that is an IP-level block on a shared GitHub runner and is',
              'NOT retryable. The next scheduled slot draws a different IP and normally recovers.',
              'Escalate only if several CONSECUTIVE runs are blocked — that means the block is',
              'following our behaviour rather than our luck.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label,
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: [label] });
            }
