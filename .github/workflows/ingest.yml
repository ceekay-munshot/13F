name: Ingest 13F filings

# ---------------------------------------------------------------------------
# SAME-DAY 13F INGEST — follow the filings, keep a cursor, never lose a place.
#
# WHAT WENT WRONG, AND WHY THIS FILE LOOKS DIFFERENT NOW
# ------------------------------------------------------
# Discovery asked EDGAR for TODAY's daily index first, every run. EDGAR answers
# 403 — not 404 — for a daily index it has not cut yet, and 403 in this project
# correctly means "the SEC has blocked this IP, stop". So every run declared
# itself blocked on its first request, fell back to thirteen hard-coded
# favourites, and reported SUCCESS. Four days past the Q2-2026 deadline the
# dashboard held 13 filers out of the ~10,700 who had filed, and a client asked
# why a manager who filed on 29 July was missing.
#
# Three things changed:
#
#   1. THE WATCHLIST FALLBACK IS GONE. It is what let a completely broken
#      discovery look like a working pipeline for a whole quarter. A run that
#      cannot reach the SEC now does nothing, says so, and stops.
#   2. THERE IS A CURSOR, IN R2. Every daily index read seeds a list of filers
#      owed an ingest; a filer leaves that list only once its artifacts are
#      published. A blocked run, a dropped cron or a timeout no longer loses a
#      filing — it only defers one.
#   3. THE RUN IS BUDGETED AND HONEST. A filing season is ten thousand managers,
#      far more than one job can fetch politely, so each run drains a bounded
#      slice, publishes exactly what it finished, and prints how much of the
#      quarter is actually on the dashboard.
#
# The safety properties that were already here are unchanged: this job never
# writes a shared index (allowlist in shared/manifest-merge.mjs), MERGES the
# manifest into the live copy rather than replacing it, and verifies the merge
# before anything leaves. If the live manifest cannot be read, or the merge
# would lose a period or a filer, it exits non-zero having written NOTHING.
#
# Every three hours, off-minute — :00 is the most contended minute on the
# platform, and GitHub is explicit that scheduled runs are best-effort, so the
# job is idempotent and extra runs are free.
# ---------------------------------------------------------------------------
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      periods:
        # TWO. A delta needs the filed quarter and the one before it. Longer
        # history is preserved by merging each fund's summary, not by re-fetching.
        description: 'Quarters of history to ingest (2 is enough for deltas)'
        default: '2'
      funds:
        description: 'Comma-separated CIKs (blank = whoever EDGAR says filed and we have not ingested)'
        default: ''
      max_funds:
        description: 'Cap on funds this run may ingest'
        default: '800'
      reset_cursor:
        description: 'Ignore the saved cursor and re-read the whole season'
        type: boolean
        default: false

# Queue, never cancel: each run does real work and a cancelled run leaves the
# artifact tree half-written.
concurrency:
  group: 13f-ingest
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    # The fund loop stops itself at --budget-seconds (40 minutes); this is the
    # backstop for everything around it — checkout, gates, the plan, and the
    # publish. Generous because a backlog run is a long one, bounded because a
    # hung job should fail rather than burn six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Fail before doing any work, with a message that says what to fix.
      - name: Validate configuration
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Repository variable SEC_USER_AGENT is not set."
            echo "::error::The SEC rejects undeclared automated access. Set it to"
            echo "::error::'<App or Company Name> <contact email>', e.g. 'Munshot 13F Pipeline you@example.com'."
            exit 1
          fi
          case "$SEC_USER_AGENT" in
            *@*.*) ;;
            *) echo "::error::SEC_USER_AGENT must contain a contact email address."; exit 1 ;;
          esac
          for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set — see DEPLOY.md."; exit 1; fi
          done

      - run: npm ci

      # The correctness gates run BEFORE any network call. If the parser is
      # broken we would rather publish nothing than publish wrong numbers.
      - name: Correctness gates
        run: npm run check

      # continue-on-error: this is a display column, not data. A transient SEC
      # 503 here must never cost the filings ingest that follows it.
      - name: Refresh CUSIP to ticker map
        id: securities
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          # 3, not 5. The SEC's stated ceiling is 10 across all its hosts; this
          # runs on a shared machine that many other projects also point at sec.gov,
          # so the polite budget is smaller than the published one.
          SEC_RATE_LIMIT_RPS: '3'
        run: node scripts/build-securities.mjs --months=4

      - name: Note degraded enrichment
        if: steps.securities.outcome != 'success'
        run: |
          echo "::warning::CUSIP->ticker refresh failed — holdings will show issuer names without tickers. Values and deltas are unaffected."

      # ---------------------------------------------------------------------
      # THE CURSOR LIVES IN R2, NOT IN THE ACTIONS CACHE.
      #
      # It used to be an actions/cache entry keyed on the run id. That cache was
      # never once written, because the only step that wrote the file ran after a
      # success that never happened — and even had it worked, GitHub evicts cache
      # entries after seven days of no hits and under storage pressure, which is
      # the wrong durability for the record of what a filing season still owes us.
      #
      # R2 is already this job's storage, already credentialed here, and
      # publish-r2.mjs is told to leave the `state/` prefix alone when it prunes.
      # ---------------------------------------------------------------------
      - name: Fetch the ingest cursor
        if: github.event.inputs.reset_cursor != 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || '13f' }}
        run: node scripts/publish-day.mjs --pull-state=.cache/day-cursor.json

      # WHO STILL NEEDS FETCHING?
      #
      # One request lists which daily indexes EDGAR has actually cut; the ones we
      # have not read yet are read; whoever filed and has not been published is
      # offered up, newest-day-first for a reserved share so same-day freshness is
      # never starved by a backlog, oldest-first for the rest so the backlog drains.
      - name: Plan this run
        id: plan
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          SEC_RATE_LIMIT_RPS: '3'
        run: |
          mkdir -p .cache
          if [ -n "${{ github.event.inputs.funds }}" ]; then
            printf '%s' '${{ github.event.inputs.funds }}' > .cache/ciks.txt
            echo '{"period":null,"blocked":false,"filersKnown":0,"filersPending":0,"filersSelected":0}' > .cache/plan.json
            echo "Using the funds given on dispatch; the cursor is left alone."
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/discover-13f-filers.mjs \
              --max-funds='${{ github.event.inputs.max_funds || 800 }}' \
              --state=.cache/day-cursor.json \
              --out-state=.cache/day-cursor.next.json \
              --out=.cache/ciks.txt \
              --out-plan=.cache/plan.json > /dev/null
          fi
          node -e '
            const p = JSON.parse(require("fs").readFileSync(".cache/plan.json", "utf8"));
            const out = require("fs").createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" });
            out.write(`blocked=${p.blocked ? "true" : "false"}\n`);
            out.write(`selected=${p.filersSelected ?? 0}\n`);
            out.write(`pending=${p.filersPending ?? 0}\n`);
            out.write(`known=${p.filersKnown ?? 0}\n`);
            out.end();
          '

      - name: The SEC is refusing us this run
        if: steps.plan.outputs.blocked == 'true'
        run: |
          echo "::warning::The SEC refused this machine. Nothing was lost — the cursor is untouched and the next scheduled run resumes from it on a different IP."
          echo 'The SEC refused this run. Nothing was lost; the next run resumes from the same place.' >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing to do
        if: steps.plan.outputs.blocked != 'true' && steps.plan.outputs.selected == '0'
        run: |
          echo "Every filer EDGAR has published in the window is already on the dashboard."
          echo 'Up to date — every filer EDGAR has published in the window is already on the dashboard.' >> "$GITHUB_STEP_SUMMARY"

      - name: Ingest filings and build artifacts
        if: steps.plan.outputs.blocked != 'true' && steps.plan.outputs.selected != '0'
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          SEC_RATE_LIMIT_RPS: '3'
        # --out is a SCRATCH directory, not public/data.
        #
        # public/data is a committed tree: 2,399 artifacts for 397 funds across
        # 74 quarters, last built on 2026-07-30. The ingest writes on top of it
        # rather than replacing it, and the publisher walks whatever it finds —
        # so pointing --out there uploaded fortnight-old copies over fresher ones
        # in R2 and resurrected quarters the retention prune had removed, for any
        # discovered manager that happened to be in the checkout. A clean
        # directory holds only this run's work. (publish-day.mjs also refuses
        # keys outside this run's quarters, so both halves have to fail before a
        # stale file can escape.)
        #
        # Two quarters, not eight: a delta needs the filed quarter and the one
        # before it. The budget is what keeps a season-sized backlog inside the
        # job timeout — the loop checks the clock between funds and stops clean,
        # and whatever it did not reach stays queued in the cursor.
        run: |
          node scripts/ingest-funds.mjs \
            --periods=${{ github.event.inputs.periods || '2' }} \
            --funds-file=.cache/ciks.txt \
            --budget-seconds=2400 \
            --out-completed=.cache/completed.txt \
            --out=.build/data | tee /tmp/ingest.log

      # A run that finished nothing while work was waiting is not a quiet day —
      # it is the failure this whole file exists to make impossible. Say so loudly
      # rather than letting a green tick imply coverage nobody has.
      - name: Assert the run actually did something
        if: steps.plan.outputs.blocked != 'true' && steps.plan.outputs.selected != '0'
        run: |
          COMPLETED=$(tr ',' '\n' < .cache/completed.txt 2>/dev/null | grep -c . || true)
          echo "completed $COMPLETED of ${{ steps.plan.outputs.selected }} planned"
          if [ "${COMPLETED:-0}" -eq 0 ]; then
            echo "::error::${{ steps.plan.outputs.selected }} filers were queued and none were ingested."
            exit 1
          fi

      # CROSS OFF WHAT THE INGEST ACTUALLY FINISHED — not what the plan offered.
      #
      # Those differ on every run the budget cuts short, and crossing off the plan
      # would abandon the tail of each one. This also recomputes how many managers
      # are now on the dashboard, which is the number the publish step stamps into
      # the manifest and the Filings view reads.
      - name: Advance the cursor
        if: steps.plan.outputs.blocked != 'true' && steps.plan.outputs.selected != '0' && steps.plan.outputs.dispatch != 'true'
        run: |
          node scripts/discover-13f-filers.mjs --commit \
            --state=.cache/day-cursor.next.json \
            --completed=.cache/completed.txt \
            --out-state=.cache/day-cursor.next.json \
            --out-plan=.cache/plan.json

      - name: Publish to R2
        if: steps.plan.outputs.blocked != 'true' && steps.plan.outputs.selected != '0'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || '13f' }}
        # --state is uploaded LAST and only on success, so the cursor can never
        # mark a filer done whose artifacts did not land. On a dispatch with an
        # explicit fund list there is no cursor to advance.
        run: |
          ARGS="--dir=.build/data --ciks-file=.cache/completed.txt --plan=.cache/plan.json"
          if [ "${{ steps.plan.outputs.dispatch }}" != "true" ]; then
            ARGS="$ARGS --state=.cache/day-cursor.next.json"
          fi
          # shellcheck disable=SC2086
          node scripts/publish-day.mjs $ARGS | tee -a /tmp/ingest.log

      - name: Summary
        if: always()
        run: |
          {
            echo '### 13F same-day ingest'
            echo ''
            if [ -f .cache/plan.json ]; then
              node -e '
                const p = JSON.parse(require("fs").readFileSync(".cache/plan.json", "utf8"));
                if (p.blocked) { console.log("The SEC refused this run. Nothing lost; the next run resumes."); process.exit(0); }
                const done = p.filersIngested ?? (p.filersKnown - p.filersPending);
                const pct = p.filersKnown ? Math.round((done / p.filersKnown) * 100) : 0;
                console.log(`**${p.period ?? "current quarter"}** — EDGAR has published **${p.filersKnown}** 13F filers for this quarter.`);
                console.log("");
                console.log(`${p.committedAt ? "After" : "Before"} this run: **${done}** on the dashboard (${pct}%), ${p.filersPending} still queued.`);
                console.log(`This run took ${p.filersSelected}.`);
                if (p.indexDaysUnread) console.log(`${p.indexDaysUnread} daily index file(s) still unread — the next run picks them up.`);
              '
            fi
            echo ''
            echo '```'
            tail -25 /tmp/ingest.log 2>/dev/null || echo '(no log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = '13f-ingest-failure';
            const title = '13F ingest is failing';
            const body = [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'A SEC 403 no longer fails this job: it is reported as a warning, nothing is lost, and',
              'the next scheduled slot resumes from the ingest cursor on a different IP. So a failure',
              'here is something else, and worth reading the log for.',
              '',
              'Note that EDGAR answers 403 for a path that does not exist as well as for a blocked IP.',
              'SecFetcher tells those apart by probing a known-good file — see scripts/_sec-fetch.mjs.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label,
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: [label] });
            }
